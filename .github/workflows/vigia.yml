name: Vigia cupos Registro Civil

on:
  schedule:
    # GitHub no garantiza el horario: suele atrasarse entre 5 y 20 minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Si una corrida se atrasa y se pisa con la siguiente, que no corran juntas:
# las dos leerían el mismo estado.json y podrían avisar dos veces.
concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar agendas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python vigia.py

      # Solo se commitea si cambió el estado (aparecen o se van los cupos), no
      # cada 5 minutos. Sin esto, cada corrida arrancaría de cero y avisaría
      # otra vez por los mismos cupos.
      - name: Guardar estado.json si cambió
        run: |
          git add -f estado.json
          if ! git diff --cached --quiet; then
            git config user.name "vigia-registro-civil"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: actualizar estado del vigía [skip ci]"
            git push
          fi
